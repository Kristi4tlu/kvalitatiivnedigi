<!DOCTYPE html>
<html>
 <head>
  
 <title>Šotimaakaart</title>
  
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
  
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   img { border: 0;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
   
<script>
  var kaart;
  var kohad = [];
  var jooned;

  function algus(){
    kaart = L.map('kaardikiht').setView([56.8, -4.2], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(kaart);

    jooned = L.layerGroup().addTo(kaart);

    fetch("https://script.google.com/macros/s/AKfycbzCVD8jlFebzNe0mjbLmzFFx77g5sSiuqNsRclWDnvseeuQtVCkYzJRneI-c-dw9JLZaw/exec")
      .then(d => d.json())
      .then(kuva);

    kaart.on("click", vajutus);
  }

  function kuva(andmed) {
    kohad = andmed;

    for (let nr = 1; nr < kohad.length; nr++) {
      let koht = kohad[nr];

      L.marker([koht[0], koht[1]])
        .addTo(kaart)
        .bindPopup(koht[2]);
    }
  }

  function vajutus(e) {
    let valitud = e.latlng;

    L.marker(valitud)
      .addTo(kaart)
      .bindPopup("Sinu valitud asukoht")
      .openPopup();

    jooned.clearLayers();

    for (let nr = 1; nr < kohad.length; nr++) {
      let koht = kohad[nr];

      let kaugus = valitud.distanceTo([koht[0], koht[1]]);
      let kaugusKm = (kaugus / 1000).toFixed(1);

      L.polyline([
        valitud,
        [koht[0], koht[1]]
      ])
      .addTo(jooned)
      .bindPopup(koht[2] + ": " + kaugusKm + " km");
    }
  }
</script>
 </head>  

 <body onload="algus()">
  <div id="kaardikiht"></div>
 </body>
</html>
