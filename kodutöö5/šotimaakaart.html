<!DOCTYPE html>
<html>
 <head>
  
 <title>Šotimaakaart</title>
  
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
  
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   img { border: 0;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
   
<script>
  var kaart;
  var kohad = [];
  var jooned;
  var valitudMarker;

  function algus(){
    kaart = L.map('kaardikiht').setView([56.8, -4.2], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(kaart);

    jooned = L.layerGroup().addTo(kaart);

    fetch("https://script.google.com/macros/s/AKfycbzCVD8jlFebzNe0mjbLmzFFx77g5sSiuqNsRclWDnvseeuQtVCkYzJRneI-c-dw9JLZaw/exec")
      .then(d => d.json())
      .then(kuva);

    kaart.on("click", vajutus);
  }

  function kuva(andmed) {
    kohad = andmed;

    for (let nr = 1; nr < kohad.length; nr++) {
      let koht = kohad[nr];

      L.marker([koht[0], koht[1]])
        .addTo(kaart)
        .bindPopup(koht[2]);
    }
  }

  function vajutus(e) {

    // Kui markerit veel ei ole, siis loome selle
    if (valitudMarker == null) {

      valitudMarker = L.marker(e.latlng, {
        draggable: true
      })
      .addTo(kaart)
      .bindPopup("Sinu valitud asukoht")
      .openPopup();

      // Kui markerit liigutatakse, käivita liikumine
      valitudMarker.on("dragend", liikumine);

    } else {

      // Kui marker on juba olemas, liiguta see uude klikitud kohta
      valitudMarker.setLatLng(e.latlng);

    }

    liikumine();
  }

  function liikumine() {

    // Saame liigutatava markeri uue asukoha
    let valitud = valitudMarker.getLatLng();

    // Kustutame vanad teed
    jooned.clearLayers();

    // Iga tabelis oleva koha jaoks uus marsruut
    for (let nr = 1; nr < kohad.length; nr++) {

      let koht = kohad[nr];

      let aadress =
        "https://router.project-osrm.org/route/v1/driving/" +
        valitud.lng + "," + valitud.lat + ";" +
        koht[1] + "," + koht[0] +
        "?overview=full&geometries=geojson";

      fetch(aadress)
        .then(d => d.json())
        .then(kuvaTee);
    }
  }

  function kuvaTee(andmed) {

    let tee = andmed.routes[0];

    let kaugusKm = (tee.distance / 1000).toFixed(1);

    console.log("Sõidutee:", kaugusKm, "km");
    console.log("Sõiduaeg:", tee.duration);

    L.geoJSON(tee.geometry)
      .addTo(jooned)
      .bindPopup("Sõidutee: " + kaugusKm + " km");
  }

</script>
 </head>  
 <body onload="algus()">
  <div id="kaardikiht"></div>
 </body>
</html>
