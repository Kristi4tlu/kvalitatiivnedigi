<!doctype html>
<html>
  <head>
    <style>
      body {
        background-color: #887662;
      }

      h1 {
        background-color: #453322;
        padding: 30px;
      }

      h2 {
        color: #37261f;
      }
      .sisu {
  text-align: center;
}

    <title>Lugemisaja kalkulaator</title>
      

    <script>
      function arvutus() {
        vastus.innerText = "Raamatu lugemiseks kulub umbes "
          + (leheküljed.valueAsNumber / kiirus.valueAsNumber).toFixed(1)
          + " tundi";
      }
    </script>
  </head>

  <body>
<div class ="sisu">
    <h1>★ Lugemisaja kalkulaator ★</h1>
  <br />
  <br />
  

    <p>Mitu lehekülge on raamatus?</p>
    <input type="number" id="leheküljed" />

    <p>Mitu lehekülge loed tunnis?</p>
    <input type="number" id="kiirus" />

    <input type="button" value="Arvuta" onclick="arvutus()" />

    <p id="vastus">Vastuse koht</p>
  <br />
  <br />
    
   
    <img src="raamatud2.png" width="300"/>
    </div>
    
    <br />
    
    <a href="Lugemisklubi.html">← Tagasi avalehele</a>

  </body>
</html>
