<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`SELECT ?isik ?isikLabel ?sõda ?sõdaLabel
            WHERE {
              ?isik wdt:P27 wd:${riik.value}.
              ?isik wdt:P106 wd:${amet.value}.
              ?isik wdt:P607 ?sõda.

            SERVICE wikibase:label {
        bd:serviceParam wikibase:language "et,en".
        }
      }
      LIMIT 50 
           `;
          
           console.log(lause);
           let aadress="https://query.wikidata.org/sparql?format=json&query=" + encodeURI(lause);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }

        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
          
          for (let rida of d["results"]["bindings"]) {
          let element = document.createElement("li");
          
          //sõdade ja valitsejate mõlemate kuvamiseks  
          element.textContent =
          rida["isikLabel"]["value"] + " – " +
          rida["sõdaLabel"]["value"];

          vastus.appendChild(element);
            
            }
          }
     </script>
  </head>
  
  <body>
        <select id="riik" onchange="kysi()">
        <option value="Q142">Prantsusmaa</option>
        <option value="Q34">Rootsi</option>
        <option value="Q43287">Saksa keisririik</option> //(1871-1918)
        <option value="Q179876">Inglise kuningriik</option> //(927–1649; 1660–1707)
        </select>
    
        <select id="amet" onchange="kysi()">
        <option value="Q116">Monarh</option>
        <option value="Q2285706">Valitsusjuht</option> 
        </select>
    
     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
