<!doctype html>
<html>
  <head>
    <title>Ämblikud</title>
    <script>
      let g;
      let ilmaandmed = [];
      let skript;

      // Andmete laadimine Google Spreadsheetist
      function uuendaAndmed() {
        if (skript) {
          skript.remove();
        }
        skript = document.createElement("script");
        skript.src = "https://script.google.com/macros/s/AKfycbxBnD1k5ondfPw-cQahgN2twHtXIOnuJg2DNP2-2SvY1z9yz8Uu2TGJNWxc6YIzpe04/exec?callback=saadudAndmed";
        document.body.appendChild(skript);
      }

      function saadudAndmed(andmed) {
        ilmaandmed = andmed;
        joonista();
      }

  
      function amblik(x, y, pea, keha, jalad, jalaPikkus) {

  // Pea ja keha asukoht
  let peaY = y - keha - pea;

 // Ämbliku jalad
for (let i = 0; i < jalad; i++) {

  // Määrame, kummale poole jalg läheb
  let pool = i % 2 === 0 ? -1 : 1;

  // Määrame jalgade kõrguse
  let koht = Math.floor(i / 2);

  let nihe = (koht - Math.floor(jalad / 4)) * 15;

  // Jala alguspunkt keha küljes
  let x1 = x + pool * keha * 0.85;
  let y1 = y + nihe;

  // Jala lõpp-punkt
  let x2 = x + pool * (keha + jalaPikkus);
  let y2 = y + nihe + (koht - 1.5) * 10;

  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();
}

  // Ämbliku keha
  g.beginPath();
  g.arc(x, y, keha, 0, 2 * Math.PI);
  g.stroke();

  // Ämbliku pea
  g.beginPath();
  g.arc(x, peaY, pea, 0, 2 * Math.PI);
  g.stroke();

  // Ämbliku silmad
  g.beginPath();
  g.arc(x - pea / 3, peaY - pea / 4, 2, 0, 2 * Math.PI);
  g.arc(x + pea / 3, peaY - pea / 4, 2, 0, 2 * Math.PI);
  g.fill();
}

      // Kõikide ämblike joonistamine
   function joonista() {
  let tahvel = document.getElementById("tahvel");
  g = tahvel.getContext("2d");

  g.clearRect(0, 0, tahvel.width, tahvel.height);

  for (let i = 0; i < ilmaandmed.length; i++) {
    let d = ilmaandmed[i];

    let x = 200 + i * 350;
    let y = 180;

    amblik(
      x,
      y,
      Number(d.pea),
      Number(d.keha),
      Number(d.jalad),
      Number(d.jalaPikkus)
    );

    g.font = "16px Arial";
    g.textAlign = "center";
    g.fillText(d.nimi, x, 300);
  }
}
    </script>
  </head>

  <body>
    <h1>Ämblikud</h1>

    <input type="button" value="Uuenda" onclick="uuendaAndmed()" />

    <br><br>

    <canvas id="tahvel" width="800" height="350">
    </canvas>

  </body>
</html>
